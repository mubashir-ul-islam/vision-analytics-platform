server {
    listen 80;

    large_client_header_buffers 4 32k;
    client_header_buffer_size 8k;

    # Docker internal DNS — use variable so nginx resolves at request time, not startup
    resolver 127.0.0.11 valid=30s;
    set $upstream attendance-backend;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE endpoint — buffering must be off, keep-alive connection
    location = /api/events {
        proxy_pass http://$upstream:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600;
    }

    # Backend API proxy — no path in proxy_pass so full URI is forwarded unchanged
    location /api/ {
        proxy_pass http://$upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # MJPEG camera streams — buffering MUST be off
    location /camera/ {
        proxy_pass http://$upstream:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600;
    }
}
